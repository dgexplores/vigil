name: Verify Oracle ARM deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm-compose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deployment renderer dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Verify deployment isolation and secret preservation
        run: python -m unittest discover -s tests -p test_oracle_deployment.py -v
      - name: Render isolated CI configuration
        run: python deploy/oracle/prepare.py --state-dir "$RUNNER_TEMP/vigil" --hostname localhost
      - name: Validate and build native ARM images
        run: |
          docker compose -f "$RUNNER_TEMP/vigil/compose.json" config --quiet
          docker compose -f "$RUNNER_TEMP/vigil/compose.json" --profile agents --parallel 2 build
      - name: Start the real database and banking stack
        run: |
          docker compose -f "$RUNNER_TEMP/vigil/compose.json" up -d ledger-db accounts-db migrate userservice contacts ledgerwriter balancereader transactionhistory frontend genal-toolbox-service
          python deploy/oracle/verify.py --compose "$RUNNER_TEMP/vigil/compose.json"
      - name: Clean up disposable CI stack
        if: always()
        run: docker compose -f "$RUNNER_TEMP/vigil/compose.json" --profile agents down --volumes --remove-orphans
