apiVersion: v1
kind: Namespace
metadata:
  name: vigil-system
  labels:
    name: vigil-system
    purpose: fraud-detection
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vigil-config
  namespace: vigil-system
  labels:
    app: vigil-system
    component: configuration
data:
  # Risk assessment configuration
  risk_threshold: "75"
  
  # Observer configuration
  polling_interval: "5"  # seconds
  batch_size: "100"
  
  # Action execution settings
  auto_execute_actions: "false"  # Set to true for production with proper safeguards
  
  # Fraud detection settings
  confidence_minimum: "0.3"
  
  # Monitoring configuration
  enable_metrics: "true"
  log_level: "INFO"
  
  # A2A communication settings
  a2a_timeout: "30"  # seconds
  
  # Regional settings for Latin America focus
  target_regions: "BR,MX,CO,AR,CL"
  
  # PIX-specific fraud patterns (Brazil)
  pix_keywords: "emergencia,urgente,hospital,acidente,ajuda"
  
  analyst-config.yaml: |
    agent:
      name: "vigil_analyst_agent"
      model: "gemini-2.5-flash"
      version: "1.0"
      risk_threshold: 75
      confidence_minimum: 0.3
    fraud_detection:
      regions:
        - "Brazil"
        - "Mexico"
        - "Colombia"
        - "Argentina"
        - "Chile"
      high_risk_categories:
        - "gambling"
        - "adult_content"
        - "crypto_exchange"
        - "cash_advance"
        - "money_transfer"
    logging:
      level: "INFO"
      structured_output: true
      log_sensitive_data: false
---
apiVersion: v1
kind: Secret
metadata:
  name: vigil-secrets
  namespace: vigil-system
  labels:
    app: vigil-system
    component: secrets
type: Opaque
data:
  # Base64 encoded API key - replace with actual values
  # To encode: echo -n "your-actual-api-key" | base64
  gemini-api-key: "REDACTED"
  
  # Bank of Anthos database credentials (if needed)
  # db-username: "YmFuay11c2Vy"
  # db-password: "REDACTED"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vigil-service-account
  namespace: vigil-system
  labels:
    app: vigil-system
    component: service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: vigil-system
  name: vigil-role
  labels:
    app: vigil-system
    component: rbac
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vigil-role-binding
  namespace: vigil-system
  labels:
    app: vigil-system
    component: rbac
subjects:
- kind: ServiceAccount
  name: vigil-service-account
  namespace: vigil-system
roleRef:
  kind: Role
  name: vigil-role
  apiGroup: rbac.authorization.k8s.io